<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verdict API — Swagger UI</title>
    <!-- Relative so it resolves under the deploy base path (…github.io/verdict-ui/icon.svg), same mark as the docs site. -->
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      body { margin: 0; background: #fff; }
      .topbar { display: none; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
    <script>
      window.addEventListener("load", () => {
        window.ui = SwaggerUIBundle({
          // Relative (not "/openapi.json") so it resolves under the deploy base path — on a project
          // Pages site the spec lives at …github.io/verdict-ui/openapi.json, not the domain root.
          url: "openapi.json",
          dom_id: "#swagger-ui",
          deepLinking: true,
          docExpansion: "list",
          defaultModelsExpandDepth: 1,
          presets: [SwaggerUIBundle.presets.apis],
        });
      });
    </script>
  </body>
</html>
